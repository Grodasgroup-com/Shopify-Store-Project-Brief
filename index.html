<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grodas · Shopify Stores Presale</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#008060;--green-light:#e6f4f0;--green-mid:#00a67d;--green-dark:#006048;
  --gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;
  --gray-400:#9ca3af;--gray-500:#6b7280;--gray-600:#4b5563;--gray-800:#1f2937;--gray-900:#111827;
  --red:#dc2626;--red-light:#fef2f2;--red-mid:#b91c1c;
  --amber:#d97706;--amber-light:#fffbeb;
  --blue:#1d4ed8;--blue-light:#eff6ff;
  --radius:10px;--radius-sm:6px;
  --shadow:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 14px rgba(0,0,0,.09);
}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:13px;line-height:1.5;color:var(--gray-800);
  background:#eef0f3;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;padding:20px 14px 60px;
}
.shell{width:100%;max-width:640px}

/* Top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:8px}
.brand-icon{width:26px;height:26px;background:var(--green);border-radius:6px;display:flex;align-items:center;justify-content:center}
.brand-icon svg{width:14px;height:14px;fill:#fff}
.brand-name{font-size:10px;font-weight:700;color:var(--green);letter-spacing:.09em;text-transform:uppercase}
.btn-home{font-size:11px;color:var(--gray-400);cursor:pointer;background:none;border:none;font-family:inherit;padding:3px 7px;border-radius:5px;transition:all .15s}
.btn-home:hover{background:var(--gray-100);color:var(--gray-600)}

/* Progress */
.progress-wrap{margin-bottom:14px}
.progress-bar-bg{height:2px;background:var(--gray-200);border-radius:2px;overflow:hidden}
.progress-bar-fill{height:2px;background:var(--green);border-radius:2px;transition:width .4s ease}
.progress-meta{display:flex;justify-content:space-between;margin-top:4px}
.progress-step-name{font-size:10px;color:var(--gray-400);font-weight:500}
.progress-count{font-size:10px;color:var(--gray-400)}

/* Card */
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow-md);overflow:hidden}
.card-body{padding:20px}

/* Step labels */
.step-eyebrow{font-size:9px;font-weight:700;color:var(--green);letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px}
.step-title{font-size:1.15rem;font-weight:700;color:var(--gray-900);margin-bottom:3px;line-height:1.2}
.step-hint{font-size:11px;color:var(--gray-400);margin-bottom:16px;line-height:1.4}

/* Questions */
.qn{margin-bottom:14px}
.qn:last-child{margin-bottom:0}
.qn-title{font-size:12px;font-weight:600;color:var(--gray-800);margin-bottom:2px}
.qn-hint{font-size:10px;color:var(--gray-400);margin-bottom:5px;line-height:1.3}

/* Options — вертикальний список (default) */
.opts{display:flex;flex-direction:column;gap:4px}

/* Options — таблетки в ряд */
.opts-pills{display:flex;flex-wrap:wrap;gap:5px}
.opts-pills .opt{padding:5px 11px;font-size:12px}

/* Options */
.opt{
  padding:7px 11px;border-radius:var(--radius-sm);border:1.5px solid var(--gray-200);
  background:#fff;cursor:pointer;font-size:12px;color:var(--gray-600);
  transition:all .15s;user-select:none;line-height:1.35;
}
.opt:hover{border-color:var(--green);color:var(--green);background:var(--green-light)}
.opt.sel{border-color:var(--green);background:var(--green-light);color:var(--green);font-weight:600}

/* Multi options */
.opt-multi{
  display:flex;align-items:flex-start;gap:7px;
  padding:6px 10px;border-radius:var(--radius-sm);border:1.5px solid var(--gray-200);
  background:#fff;cursor:pointer;font-size:12px;color:var(--gray-600);
  transition:all .15s;user-select:none;line-height:1.35;
}
.opt-multi:hover{border-color:var(--green);color:var(--green);background:var(--green-light)}
.opt-multi.sel{border-color:var(--green);background:var(--green-light);color:var(--green);font-weight:600}
.chk{width:13px;height:13px;border-radius:3px;border:1.5px solid var(--gray-300);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:all .15s;font-size:9px;color:transparent}
.opt-multi.sel .chk{background:var(--green);border-color:var(--green);color:#fff}

/* Multi pills */
.opts-pills .opt-multi{padding:5px 10px;font-size:12px}

/* Callouts */
.note-warn{margin-top:4px;padding:5px 9px;border-radius:var(--radius-sm);background:var(--amber-light);border-left:3px solid var(--amber);font-size:11px;color:var(--amber);line-height:1.3}
.note-stop{margin-top:4px;padding:5px 9px;border-radius:var(--radius-sm);background:var(--red-light);border-left:3px solid var(--red);font-size:11px;color:var(--red-mid);line-height:1.3}
.note-info{margin-top:4px;padding:5px 9px;border-radius:var(--radius-sm);background:var(--blue-light);border-left:3px solid var(--blue);font-size:11px;color:var(--blue);line-height:1.3}

/* Text inputs */
.tf{width:100%;padding:7px 10px;border-radius:var(--radius-sm);border:1.5px solid var(--gray-200);font-size:12px;color:var(--gray-800);font-family:inherit;outline:none;transition:border-color .15s;line-height:1.4;resize:vertical}
.tf:focus{border-color:var(--green)}
.tf::placeholder{color:var(--gray-400)}
.indent{padding-left:12px;border-left:2px solid var(--gray-200);margin-top:6px}
.divider{height:1px;background:var(--gray-100);margin:16px 0}

/* Footer nav */
.footer-nav{display:flex;gap:7px;padding:11px 20px;border-top:1px solid var(--gray-100);align-items:center}
.btn-back{padding:7px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--gray-200);background:#fff;color:var(--gray-600);cursor:pointer;font-size:12px;font-family:inherit;font-weight:500;transition:all .15s}
.btn-back:hover{border-color:var(--gray-400)}
.btn-next{padding:7px 18px;border-radius:var(--radius-sm);border:none;background:var(--green);color:#fff;cursor:pointer;font-size:12px;font-family:inherit;font-weight:600;transition:all .15s;margin-left:auto}
.btn-next:hover{background:var(--green-mid)}
.btn-next:disabled{background:var(--gray-200);color:var(--gray-400);cursor:not-allowed}

/* Decision badges */
.decision-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:20px;font-size:12px;font-weight:600;margin-bottom:12px}
.badge-go{background:#dcfce7;color:#166534}
.badge-clarify{background:#fef9c3;color:#92400e}
.badge-nogo{background:var(--red-light);color:var(--red-mid)}
.badge-pd{background:var(--blue-light);color:var(--blue)}

/* Summary */
.s-block{margin-bottom:14px}
.s-block-head{display:flex;align-items:center;gap:5px;margin-bottom:5px}
.s-icon{font-size:11px}
.s-title{font-size:9px;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:.08em}
.sum-row{display:flex;gap:8px;padding:4px 0;border-bottom:1px solid var(--gray-100);align-items:baseline}
.sum-row:last-child{border-bottom:none}
.sum-key{font-size:11px;color:var(--gray-400);min-width:130px;flex-shrink:0}
.sum-val{font-size:12px;color:var(--gray-800);line-height:1.3}
.sum-val.flag-stop{color:var(--red-mid);font-weight:500}
.sum-val.flag-warn{color:var(--amber);font-weight:500}

/* Export */
.export-area{background:var(--gray-50);border:1.5px solid var(--gray-200);border-radius:var(--radius-sm);padding:12px;margin-top:14px;font-family:'SFMono-Regular',Consolas,monospace;font-size:10px;line-height:1.6;color:var(--gray-600);white-space:pre-wrap;max-height:260px;overflow-y:auto}
.export-actions{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap}
.btn-copy{padding:6px 13px;border-radius:var(--radius-sm);font-size:11px;font-family:inherit;font-weight:500;cursor:pointer;transition:all .15s;border:1.5px solid var(--green);background:transparent;color:var(--green)}
.btn-copy:hover{background:var(--green-light)}
.btn-new{padding:6px 13px;border-radius:var(--radius-sm);font-size:11px;font-family:inherit;font-weight:500;cursor:pointer;transition:all .15s;border:1.5px solid var(--gray-200);background:#fff;color:var(--gray-600)}
.btn-new:hover{border-color:var(--gray-400)}

/* AI block */
.ai-block{border:1.5px solid var(--gray-200);border-radius:var(--radius-sm);padding:12px;margin-bottom:16px;background:var(--gray-50)}
.ai-label{font-size:10px;font-weight:700;color:var(--gray-500);letter-spacing:.06em;text-transform:uppercase;margin-bottom:7px;display:flex;align-items:center;gap:5px}
.ai-badge{font-size:9px;background:var(--gray-200);color:var(--gray-500);padding:2px 6px;border-radius:20px;font-weight:400;letter-spacing:0;text-transform:none}
.ai-row{display:flex;gap:7px;margin-top:7px;align-items:center}
.ai-btn{padding:6px 12px;border-radius:var(--radius-sm);border:1.5px solid var(--green);background:transparent;color:var(--green);cursor:pointer;font-size:11px;font-family:inherit;font-weight:500;transition:all .15s;white-space:nowrap}
.ai-btn:hover{background:var(--green-light)}
.ai-status{font-size:10px;color:var(--gray-400)}
.ai-note{font-size:10px;color:var(--gray-400);margin-top:4px;line-height:1.3}

/* Welcome screen */
.welcome-title{font-size:1.45rem;font-weight:700;color:var(--gray-900);margin-bottom:5px;line-height:1.2}
.welcome-sub{font-size:12px;color:var(--gray-400);margin-bottom:20px;line-height:1.55}
.role-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.role-card{padding:18px 16px;border-radius:var(--radius);border:2px solid var(--gray-200);background:#fff;cursor:pointer;transition:all .2s;text-align:left}
.role-card:hover{border-color:var(--green);box-shadow:0 0 0 3px var(--green-light)}
.role-card-icon{font-size:22px;margin-bottom:9px;display:block}
.role-card-title{font-size:13px;font-weight:700;color:var(--gray-900);margin-bottom:4px}
.role-card-desc{font-size:11px;color:var(--gray-500);line-height:1.45;margin-bottom:10px}
.role-card-pills{display:flex;flex-wrap:wrap;gap:4px}
.role-pill{font-size:10px;color:var(--gray-500);background:var(--gray-100);padding:2px 7px;border-radius:20px}
.role-card-btn{margin-top:12px;width:100%;padding:8px;border-radius:var(--radius-sm);border:none;background:var(--green);color:#fff;font-size:12px;font-family:inherit;font-weight:600;cursor:pointer;transition:all .15s}
.role-card-btn:hover{background:var(--green-mid)}
@media(max-width:500px){.role-cards{grid-template-columns:1fr}}

/* NO-GO banner */
.nogo-banner{padding:10px 13px;background:var(--red-light);border-radius:var(--radius-sm);border:1.5px solid #fca5a5;margin-bottom:14px;font-size:12px;color:var(--red-mid);line-height:1.4}
.nogo-banner strong{display:block;margin-bottom:3px}
</style>
<style>
#pwd-overlay{position:fixed;inset:0;background:#eef0f3;display:flex;align-items:center;justify-content:center;z-index:9999}
#pwd-overlay.hidden{display:none}
.pwd-card{background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.1);padding:32px 28px;width:100%;max-width:360px;text-align:center}
.pwd-logo{width:36px;height:36px;background:var(--green);border-radius:9px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.pwd-logo svg{width:18px;height:18px;fill:#fff}
.pwd-title{font-size:1.1rem;font-weight:700;color:var(--gray-900);margin-bottom:4px}
.pwd-sub{font-size:11px;color:var(--gray-400);margin-bottom:20px}
.pwd-input{width:100%;padding:9px 12px;border-radius:7px;border:1.5px solid var(--gray-200);font-size:13px;font-family:inherit;outline:none;text-align:center;letter-spacing:.05em;transition:border-color .15s;margin-bottom:10px}
.pwd-input:focus{border-color:var(--green)}
.pwd-btn{width:100%;padding:9px;border-radius:7px;border:none;background:var(--green);color:#fff;font-size:13px;font-family:inherit;font-weight:600;cursor:pointer;transition:all .15s}
.pwd-btn:hover{background:var(--green-mid)}
.pwd-error{font-size:11px;color:var(--red);margin-top:8px;min-height:16px}
</style>
</head>
<body>

<div id="pwd-overlay">
  <div class="pwd-card">
    <div class="pwd-logo"><svg viewBox="0 0 20 20"><path d="M10 2L3 7v11h5v-5h4v5h5V7L10 2z"/></svg></div>
    <div class="pwd-title">Grodas · Shopify Stores Presale</div>
    <div class="pwd-sub">Введи пароль для доступу</div>
    <input class="pwd-input" id="pwdInput" type="password" placeholder="••••••••••" onkeydown="if(event.key==='Enter')checkPwd()">
    <button class="pwd-btn" onclick="checkPwd()">Увійти →</button>
    <div class="pwd-error" id="pwdError"></div>
  </div>
</div>

<div class="shell" id="mainShell" style="display:none">
  <div class="topbar">
    <div class="brand">
      <div class="brand-icon"><svg viewBox="0 0 20 20"><path d="M10 2L3 7v11h5v-5h4v5h5V7L10 2z"/></svg></div>
      <span class="brand-name">Grodas · Shopify Stores Presale</span>
    </div>
    <button class="btn-home" id="btnHome" onclick="goHome()" style="display:none">← На головну</button>
  </div>
  <div class="progress-wrap" id="progressWrap" style="display:none">
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
    <div class="progress-meta">
      <span class="progress-step-name" id="progressName"></span>
      <span class="progress-count" id="progressCount"></span>
    </div>
  </div>
  <div class="card">
    <div class="card-body" id="cardBody"></div>
    <div class="footer-nav" id="footerNav" style="display:none">
      <button class="btn-back" id="btnBack" onclick="goBack()">← Назад</button>
      <button class="btn-back" id="btnHome2" onclick="goHome()" style="display:none;color:var(--gray-400);border-color:var(--gray-100)">🏠 Головна</button>
      <button class="btn-next" id="btnNext" onclick="goNext()">Далі →</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════
let mode = 'home'; // 'home' | 'sales' | 'pm'
let A = {};
let stepIdx = 0;

const SALES_STEPS = ['client','project','budget','decision','summary'];
const PM_STEPS    = ['pm_prefill','pm_type','pm_business','pm_tech','pm_design','pm_func','pm_integrations','pm_timeline','pm_summary'];

const SALES_NAMES = {client:'Клієнт',project:'Проект і scope',budget:'Бюджет і терміни',decision:'Рішення',summary:'Summary'};
const PM_NAMES    = {pm_prefill:'Дані від Sales',pm_type:'Тип проекту',pm_business:'Бізнес',pm_tech:'Технічний контекст',pm_design:'Дизайн',pm_func:'Функціональність',pm_integrations:'Інтеграції',pm_timeline:'Терміни і команда',pm_summary:'Summary'};

function steps(){ return mode==='sales'?SALES_STEPS:PM_STEPS; }
function sid(){ return steps()[stepIdx]; }
function stepName(s){ return mode==='sales'?SALES_NAMES[s]:PM_NAMES[s]; }

// ═══════════════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════════════
function set(k,v){ A[k]=v; render(); }
function save(k,v){ A[k]=v; }
function tog(k,v){ const a=A[k]||[]; A[k]=a.includes(v)?a.filter(x=>x!==v):[...a,v]; render(); }

function radio(k,opts){
  return opts.map(o=>{
    const id=o.id||o,label=o.label||o,note=o.note,stop=o.stop,info=o.info,sel=A[k]===id;
    return `<div class="opt${sel?' sel':''}" onclick="set('${k}','${id}')">${label}</div>
    ${sel&&stop?`<div class="note-stop">🚫 ${stop}</div>`:''}
    ${sel&&note?`<div class="note-warn">⚠️ ${note}</div>`:''}
    ${sel&&info?`<div class="note-info">ℹ️ ${info}</div>`:''}`;
  }).join('');
}
function rpills(k,opts){
  return opts.map(o=>{
    const id=o.id||o,label=o.label||o,note=o.note,stop=o.stop,info=o.info,sel=A[k]===id;
    return `<div class="opt${sel?' sel':''}" onclick="set('${k}','${id}')">${label}</div>
    ${sel&&stop?`<div class="note-stop">🚫 ${stop}</div>`:''}
    ${sel&&note?`<div class="note-warn">⚠️ ${note}</div>`:''}
    ${sel&&info?`<div class="note-info">ℹ️ ${info}</div>`:''}`;
  }).join('');
}
function qnp(title,hint,content){
  return `<div class="qn"><p class="qn-title">${title}</p>${hint?`<p class="qn-hint">${hint}</p>`:''}<div class="opts-pills">${content}</div></div>`;
}

function multi(k,opts){
  const arr=A[k]||[];
  return opts.map(o=>{
    const id=o.id||o,label=o.label||o,sel=arr.includes(id);
    return `<div class="opt-multi${sel?' sel':''}" onclick="tog('${k}','${id}')">
      <span class="chk">${sel?'✓':''}</span>${label}</div>`;
  }).join('');
}

function tf(k,ph,rows){
  const v=(A[k]||'').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  if(rows) return `<textarea class="tf" rows="${rows}" placeholder="${ph}" oninput="save('${k}',this.value)">${A[k]||''}</textarea>`;
  return `<input class="tf" placeholder="${ph}" value="${v}" oninput="save('${k}',this.value)">`;
}

function qn(title,hint,content){
  return `<div class="qn"><p class="qn-title">${title}</p>${hint?`<p class="qn-hint">${hint}</p>`:''}<div class="opts">${content}</div></div>`;
}

function sr(label,key){
  const v=A[key];
  if(!v||(Array.isArray(v)&&v.length===0)) return '';
  const d=Array.isArray(v)?v.join(', '):v;
  return `<div class="sum-row"><span class="sum-key">${label}</span><span class="sum-val">${d}</span></div>`;
}

function sblock(icon,title,rows){
  if(!rows.trim()) return '';
  return `<div class="s-block"><div class="s-block-head"><span class="s-icon">${icon}</span><span class="s-title">${title}</span></div>${rows}</div>`;
}

// ═══════════════════════════════════════════════════════════════════
// WELCOME
// ═══════════════════════════════════════════════════════════════════
function stepHome(){
  return `
    <p style="font-size:10px;font-weight:700;color:var(--green);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px">Grodas · Shopify Stores Presale</p>
    <h2 class="welcome-title">Вибери роль</h2>
    <p class="welcome-sub">Інструмент для кваліфікації клієнтів і проектів на етапі Presale компанії Grodas. Стосується Shopify магазинів. Обери опитувальник відповідно до своєї ролі і заповни його після контакту з клієнтом. Скопіюй результат і встав в Jira.</p>
    <div class="role-cards">
      <div class="role-card" onclick="startMode('sales')">
        <span class="role-card-icon">🎯</span>
        <div class="role-card-title">Sales Team</div>
        <div class="role-card-desc">Кваліфікація клієнта. Заповнюй під час або після першого контакту.</div>
        <div class="role-card-pills">
          <span class="role-pill">5 кроків</span>
          <span class="role-pill">GO / NO-GO</span>
          <span class="role-pill">~7 хв</span>
        </div>
        <button class="role-card-btn">Sales кваліфікація →</button>
      </div>
      <div class="role-card" onclick="startMode('pm')">
        <span class="role-card-icon">📐</span>
        <div class="role-card-title">Delivery Team</div>
        <div class="role-card-desc">Кваліфікація проекту. Вклей дані від Sales і рухайся вглиб.</div>
        <div class="role-card-pills">
          <span class="role-pill">8 кроків</span>
          <span class="role-pill">Delivery brief</span>
          <span class="role-pill">~15 хв</span>
        </div>
        <button class="role-card-btn">PM кваліфікація →</button>
      </div>
    </div>`;
}

function startMode(m){
  mode=m; A={}; stepIdx=0;
  document.getElementById('btnHome').style.display='';
  render();
}

function goHome(){
  mode='home'; A={}; stepIdx=0;
  document.getElementById('btnHome').style.display='none';
  render();
}

// ═══════════════════════════════════════════════════════════════════
// SALES STEPS
// ═══════════════════════════════════════════════════════════════════
function stepSalesClient(){
  return `
    <p class="step-eyebrow">Sales · крок 1 з 4</p>
    <h3 class="step-title">Клієнт і контекст</h3>
    <p class="step-hint">Хто клієнт, звідки прийшов, хто приймає рішення.</p>
    ${qn('Назва компанії або проекту','',tf('companyName','Acme Fashion / Project Aurora'))}
    ${qn('Джерело ліда','',radio('leadSource',[

// ── SALES LOGIC ──────────────────────────────────────────────────
function getSalesNoGo(){
  const r=[];
  if(A.dmStatus==='no') r.push('Decision-maker недоступний або невідомий');  if(A.budgetStance==='refuses') r.push('Клієнт відмовляється обговорювати бюджет');
  if(A.shopifyFit==='no') r.push('Вимоги виходять за межі Shopify');
  if(A.toxicComm==='yes') r.push('Токсична або неповажна комунікація');
  return r;
}
function getSalesClarify(){
  const r=[];
  if(!A.projectType) r.push('Тип проекту не визначено');
  if(!A.businessGoal) r.push('Бізнес-мета не озвучена');
  if(A.budgetStance==='unknown') r.push('Бюджет — потрібно уточнити діапазон');
  if(A.dmStatus==='proxy') r.push('Decision-maker не залучений напряму');
  if(A.resultsGuarantee==='yes') r.push('⚠️ Клієнт очікує гарантій результату — необхідно прояснити очікування до підписання');
  return r;
}
function getSalesDecision(){
  if(getSalesNoGo().length>0) return 'nogo';
  if(getSalesClarify().length>0) return 'clarify';
  return 'go';
}

function stepSalesDecision(){
  const nogo=getSalesNoGo(), clarify=getSalesClarify(), dec=getSalesDecision();
  let badge='',body='';
  if(dec==='nogo'){
    badge=`<div class="decision-badge badge-nogo">🚫 NO-GO</div>`;
    body=`<div class="nogo-banner"><strong>Причини зупинки:</strong>${nogo.map(r=>`<div>• ${r}</div>`).join('')}</div>
    <p style="font-size:13px;color:var(--gray-500);line-height:1.6">Зафіксуй причину в Jira і закрий лід. Або поверніться до клієнта з уточнюючими питаннями.</p>`;
  } else if(dec==='clarify'){
    badge=`<div class="decision-badge badge-clarify">⚡ CLARIFY FIRST</div>`;
    body=`<p style="font-size:13px;color:var(--gray-600);margin-bottom:12px;line-height:1.6">Перспективний клієнт. Перед передачею в Delivery — закрий ці питання:</p>
    ${clarify.map(r=>`<div style="padding:5px 0;border-bottom:1px solid var(--gray-100);font-size:13px;color:var(--amber)">? ${r}</div>`).join('')}`;
  } else {
    badge=`<div class="decision-badge badge-go">✅ GO</div>`;
    body=`<p style="font-size:13px;color:var(--gray-500);line-height:1.6">Клієнт кваліфікований. Передай summary в Jira і сповісти PM — він проведе кваліфікацію проекту.</p>`;
  }
  return `<p class="step-eyebrow">Sales · крок 4 з 4</p><h3 class="step-title">Рішення</h3><p class="step-hint">На основі заповнених даних.</p>${badge}${body}
  <div class="divider"></div><p style="font-size:12px;color:var(--gray-400)">Далі — Summary для копіювання в Jira.</p>`;
}

function stepSalesSummary(){
  const dec=getSalesDecision(), nogo=getSalesNoGo(), clarify=getSalesClarify();
  const decLabel=dec==='go'?'✅ GO — передавати на PM':dec==='clarify'?'⚡ CLARIFY FIRST — є відкриті питання':'🚫 NO-GO — '+nogo[0];
  let badge='';
  if(dec==='go') badge='<div class="decision-badge badge-go">✅ GO</div>';
  else if(dec==='clarify') badge='<div class="decision-badge badge-clarify">⚡ CLARIFY FIRST</div>';
  else badge='<div class="decision-badge badge-nogo">🚫 NO-GO</div>';

  const lines=[
    `SALES QUALIFICATION SUMMARY`,
    `${'═'.repeat(38)}`,
    `Дата: ${new Date().toLocaleDateString('uk-UA')}`,
    `Рішення: ${decLabel}`,
    ``,
    `КЛІЄНТ`,
    A.companyName?`Компанія: ${A.companyName}`:'',
    A.leadSource?`Джерело: ${A.leadSource}`:'',
    A.dmName?`DM: ${A.dmName}`:'',
    A.dmStatus?`DM доступний: ${A.dmStatus}`:'',

    A.prevVendorDetails?`Деталі: ${A.prevVendorDetails}`:'',
    ``,
    `ПРОЕКТ`,
    A.projectType?`Тип: ${A.projectType}`:'',
    A.businessGoal?`Бізнес-мета: ${A.businessGoal}`:'',
    A.shopifyFit?`Shopify fit: ${A.shopifyFit}`:'',
    A.designReady?`Дизайн/Референси: ${A.designReady}`:'',
    ``,
    `БЮДЖЕТ І ТЕРМІНИ`,
    A.budgetStance?`Позиція по бюджету: ${A.budgetStance}`:'',
    A.budgetRange?`Діапазон: ${A.budgetRange}`:'',
    A.hasDeadline==='yes'&&A.deadlineDate?`Дедлайн: ${A.deadlineDate}`:'',
    A.collabModel?`Модель: ${A.collabModel}`:'',
    A.salesNotes?`\nНОТАТКИ\n${A.salesNotes}`:'',
    clarify.length?`\nПОТРЕБУЄ УТОЧНЕННЯ\n${clarify.map(r=>'• '+r).join('\n')}`:'',
    nogo.length?`\nNO-GO ПРИЧИНИ\n${nogo.map(r=>'• '+r).join('\n')}`:'',
    ``,`${'═'.repeat(38)}`,
    `[Grodas · Shopify Stores Presale · Sales]`
  ].filter(l=>l!=='').join('\n').replace(/\n{3,}/g,'\n\n');

  return `<p class="step-eyebrow">Sales Summary</p>
  <h3 class="step-title">${A.companyName||'Клієнт'}</h3>
  ${badge}
  ${sblock('👤','Клієнт',sr('Джерело','leadSource')+sr('Decision-maker','dmName')+sr('DM статус','dmStatus')+sr('Попередній підрядник','prevVendor')+(A.prevVendorDetails?`<div class="sum-row"><span class="sum-key">Деталі підрядника</span><span class="sum-val flag-warn">${A.prevVendorDetails}</span></div>`:''))}
  ${sblock('📦','Проект',sr('Тип','projectType')+sr('Shopify fit','shopifyFit')+sr('Дизайн','designReady')+(A.businessGoal?`<div class="sum-row"><span class="sum-key">Бізнес-мета</span><span class="sum-val">${A.businessGoal}</span></div>`:''))}
  ${sblock('💰','Бюджет і терміни',sr('Позиція','budgetStance')+sr('Діапазон','budgetRange')+(A.hasDeadline==='yes'&&A.deadlineDate?`<div class="sum-row"><span class="sum-key">Дедлайн</span><span class="sum-val">${A.deadlineDate}</span></div>`:'')+sr('Модель','collabModel'))}
  ${clarify.length?sblock('⚡','Потребує уточнення',clarify.map(r=>`<div class="sum-row"><span class="sum-val flag-warn">? ${r}</span></div>`).join('')):''}
  ${nogo.length?sblock('🚫','NO-GO причини',nogo.map(r=>`<div class="sum-row"><span class="sum-val flag-stop">• ${r}</span></div>`).join('')):''}
  ${A.salesNotes?sblock('📝','Нотатки',`<div class="sum-row"><span class="sum-val">${A.salesNotes}</span></div>`):''}
  <div class="export-area" id="exportArea">${lines}</div>
  <div class="export-actions">
    <button class="btn-copy" onclick="copyExport()">📋 Копіювати для Jira</button>
    <button class="btn-new" onclick="goHome()">← На головну</button>
    <button class="btn-new" onclick="restartFlow()">+ Новий клієнт</button>

function buildPmRisks(){
  const risks=[];
  if(!A.pm_figmaReady||A.pm_figmaReady==='no') risks.push('Відсутній затверджений дизайн — ризик затримки старту');
  if(A.pm_projectType==='migration'&&A.pm_dataExport==='no') risks.push('Немає доступу до даних для міграції — залежимо від вендора');
  if(A.pm_projectType==='migration'&&(A.pm_migrateWhat||[]).includes('seo')) risks.push('SEO-міграція: без правильних редиректів — втрата органічного трафіку');
  if(A.pm_checkoutChanges==='checkout'&&A.shopifyPlan!=='plus') risks.push('Checkout extensibility вимагає Shopify Plus — план клієнта потрібно уточнити');
  if(A.pm_b2b==='full'&&A.shopifyPlan!=='plus') risks.push('Нативний B2B доступний лише на Shopify Plus');
  if(A.pm_contentTeam==='tbd') risks.push('Відповідальність за контент не визначена — ризик затримок');
  if(A.pm_apiDocs==='no') risks.push('API документація відсутня — оцінка інтеграції неможлива');
  if(A.pm_syncFreq==='realtime') risks.push('Реал-тайм синхронізація — суттєво вища архітектурна складність');
  if(A.pm_projectType==='integration'&&A.pm_integrationApp==='no') risks.push('Немає готового App — потрібна кастомна розробка інтеграції');
  if((A.pm_skuCount==='xlarge')) risks.push('Великий каталог — уточнити вимоги до пошуку і перформансу');
  if(A.pm_themeType==='custom'&&A.pm_projectType==='redesign') risks.push('Кастомна тема без документації — ризик непередбачених витрат');
  return risks;
}

function buildPmAssumptions(){
  const a=[];
  a.push(`Тип проекту: ${A.pm_projectType||'не визначено'}`);
  if(A.shopifyPlan) a.push(`Shopify план: ${A.shopifyPlan}`);
  if(A.pm_skuCount) a.push(`Обсяг каталогу: ${A.pm_skuCount} SKU`);
  if(A.pm_figmaReady==='full') a.push('Затверджений дизайн у Figma є — розробка може стартувати');
  else a.push('Дизайн не підтверджений — оцінка базується на описі вимог');
  if(A.pm_projectType==='migration') a.push('Дані для міграції доступні — аудит проводиться до початку розробки');
  return a;
}

    (A.pm_payments||[]).length?`Платіжки: ${A.pm_payments.join(', ')}`:'',
    (A.pm_shipping||[]).length?`Доставка: ${A.pm_shipping.join(', ')}`:'',
    (A.pm_analytics||[]).length?`Аналітика: ${A.pm_analytics.join(', ')}`:'',
    ``,
    `ТЕРМІНИ`,
    A.pm_hasDeadline==='yes'&&A.pm_deadlineDate?`Дедлайн: ${A.pm_deadlineDate}`:'Без жорсткого дедлайну',
    A.pm_postLaunch?`Підтримка після запуску: ${A.pm_postLaunch}`:'',
    A.pm_notes?`\nНОТАТКИ\n${A.pm_notes}`:'',
    assumptions.length?`\nASSUMPTIONS\n${assumptions.map(a=>'~ '+a).join('\n')}`:'',
    risks.length?`\nRISK LIST\n${risks.map(r=>'! '+r).join('\n')}`:'',
    ``,`${'═'.repeat(38)}`,
    `[Grodas · Shopify Stores Presale · PM]`
  ].filter(l=>l!=='').join('\n').replace(/\n{3,}/g,'\n\n');

  return `<p class="step-eyebrow">PM Brief · Summary</p>
  <h3 class="step-title">${A.pm_company||'Проект'}</h3>
  <div class="decision-badge badge-pd">📐 PM Delivery Brief</div>

  ${sblock('📦','Проект',
    sr('Тип','pm_projectType')+sr('Shopify план','shopifyPlan')+sr('Каталог','pm_skuCount')+
    (A.pm_goal?`<div class="sum-row"><span class="sum-key">Бізнес-мета</span><span class="sum-val">${A.pm_goal}</span></div>`:'')+
    ((A.pm_markets||[]).length?`<div class="sum-row"><span class="sum-key">Ринки</span><span class="sum-val">${A.pm_markets.join(', ')}</span></div>`:'')+
    sr('Тема','pm_theme')+sr('Поточна тема','pm_currentTheme')
  )}
  ${sblock('🎨','Дизайн',
    sr('Бренд','pm_brandMaterials')+sr('Figma','pm_figmaReady')+
    (A.pm_designRefs?`<div class="sum-row"><span class="sum-key">Референси</span><span class="sum-val">${A.pm_designRefs}</span></div>`:'')+
    sr('Контент','pm_contentTeam')
  )}
  ${sblock('⚙️','Функціонал',
    sr('Знижки','pm_discounts')+sr('Кабінет','pm_accounts')+sr('Підписки','pm_subscriptions')+
    sr('B2B','pm_b2b')+sr('Мультимова','pm_multilang')
  )}
  ${sblock('🔗','Інтеграції',
    sr('ERP/CRM','pm_erp')+sr('Облік','pm_accounting')+sr('Email','pm_email')+
    ((A.pm_payments||[]).length?`<div class="sum-row"><span class="sum-key">Платіжки</span><span class="sum-val">${A.pm_payments.join(', ')}</span></div>`:'')+
    ((A.pm_shipping||[]).length?`<div class="sum-row"><span class="sum-key">Доставка</span><span class="sum-val">${A.pm_shipping.join(', ')}</span></div>`:'')
  )}
  ${sblock('📅','Терміни і команда',
    (A.pm_hasDeadline==='yes'&&A.pm_deadlineDate?`<div class="sum-row"><span class="sum-key">Дедлайн</span><span class="sum-val">${A.pm_deadlineDate}</span></div>`:'')+
    sr('DM','pm_dm')+sr('Контакт','pm_contact')+sr('Підтримка','pm_postLaunch')
  )}
  ${assumptions.length?sblock('~','Assumptions',assumptions.map(a=>`<div class="sum-row"><span class="sum-val">${a}</span></div>`).join('')):''}
  ${risks.length?sblock('!','Risk List',risks.map(r=>`<div class="sum-row"><span class="sum-val flag-stop">! ${r}</span></div>`).join('')):''}
  ${A.pm_notes?sblock('📝','Нотатки',`<div class="sum-row"><span class="sum-val">${A.pm_notes}</span></div>`):''}

  <div class="export-area" id="exportArea">${lines}</div>
  <div class="export-actions">
    <button class="btn-copy" onclick="copyExport()">📋 Копіювати для Jira</button>
    <button class="btn-new" onclick="goHome()">← На головну</button>
    <button class="btn-new" onclick="restartFlow()">+ Новий бриф</button>
  </div>`;
}

// ═══════════════════════════════════════════════════════════════════
// NAV LOGIC
// ═══════════════════════════════════════════════════════════════════
function canNext(){
  const s=sid();
  if(s==='pm_prefill') return true;
  if(s==='pm_type') return !!A.pm_projectType;
  if(s==='pm_business') return !!A.pm_whatSell&&!!A.pm_skuCount;
  if(s==='client') return !!A.companyName&&!!A.dmStatus&&A.dmStatus!=='no';
  if(s==='project') return !!A.projectType&&!!A.businessGoal&&A.shopifyFit!=='no';
  if(s==='budget') return !!A.budgetStance&&A.budgetStance!=='refuses'&&A.toxicComm!=='yes';
  if(s==='decision') return true;
  return true;
}

function render(){
  if(mode==='home'){
    document.getElementById('cardBody').innerHTML=stepHome();
    document.getElementById('footerNav').style.display='none';
    document.getElementById('progressWrap').style.display='none';
    return;
  }

  const s=sid();
  const st=steps();
  const idx=stepIdx;
  const isSummary=s==='summary'||s==='pm_summary';

  // Progress
  if(!isSummary){
    const pct=((idx+1)/st.length)*100;
    document.getElementById('progressFill').style.width=pct+'%';
    document.getElementById('progressName').textContent=stepName(s)||'';
    document.getElementById('progressCount').textContent=(idx+1)+' / '+st.length;
    document.getElementById('progressWrap').style.display='block';
  } else {
    document.getElementById('progressWrap').style.display='none';
  }

  // Render step
  let html='';
  if(mode==='sales'){
    if(s==='client') html=stepSalesClient();
    else if(s==='project') html=stepSalesProject();
    else if(s==='budget') html=stepSalesBudget();
    else if(s==='decision') html=stepSalesDecision();
    else if(s==='summary') html=stepSalesSummary();
  } else {
    if(s==='pm_prefill') html=stepPmPrefill();
    else if(s==='pm_type') html=stepPmType();
    else if(s==='pm_business') html=stepPmBusiness();
    else if(s==='pm_tech') html=stepPmTech();
    else if(s==='pm_design') html=stepPmDesign();
    else if(s==='pm_func') html=stepPmFunc();
    else if(s==='pm_integrations') html=stepPmIntegrations();
    else if(s==='pm_timeline') html=stepPmTimeline();
    else if(s==='pm_summary') html=stepPmSummary();
  }
  document.getElementById('cardBody').innerHTML=html;

  // Footer
  const nav=document.getElementById('footerNav');
  const back=document.getElementById('btnBack');
  const home2=document.getElementById('btnHome2');
  const next=document.getElementById('btnNext');
  if(isSummary){ nav.style.display='none'; return; }
  nav.style.display='flex';
  // На першому кроці — показуємо "Головна" замість "Назад"
  if(stepIdx===0){
    back.style.display='none';
    home2.style.display='';
  } else {
    back.style.display='';
    home2.style.display='none';
  }
  next.disabled=!canNext();
  const isDecision=s==='decision';
  next.textContent=isDecision?'Сформувати Summary →':'Далі →';
}

function goNext(){
  if(!canNext()) return;
  if(stepIdx<steps().length-1){ stepIdx++; render(); window.scrollTo(0,0); }
}
function goBack(){
  if(stepIdx>0){ stepIdx--; render(); window.scrollTo(0,0); }
}
function restartFlow(){
  A={}; stepIdx=0; render();
}

// ═══════════════════════════════════════════════════════════════════
// AI AUTOFILL
// ═══════════════════════════════════════════════════════════════════
function toggleKey(){
  const f=document.getElementById('apiKey');
  f.type=f.type==='password'?'text':'password';
  event.target.textContent=f.type==='password'?'Показати':'Сховати';
}

async function autofillPm(){
  const key=(document.getElementById('apiKey')?.value||'').trim();
  const text=(document.getElementById('prefillText')?.value||'').trim();
  const status=document.getElementById('aiStatus');
  const btn=document.getElementById('aiBtn');
  if(!key||!text){ status.textContent='Вкажи API ключ і текст'; return; }
  btn.textContent='⏳ Аналізую...'; btn.style.opacity='.6'; btn.style.pointerEvents='none';
  status.textContent='';
  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',max_tokens:1500,
        messages:[{role:'user',content:`Ти — PM-аналітик Shopify-агентства. Витягни з тексту дані для Project Brief і поверни ТІЛЬКИ JSON без markdown.

Текст:
"""${text}"""

JSON поля (null якщо відсутнє):
{
  "pm_company": string|null,
  "pm_projectType": "new"|"redesign"|"migration"|"features"|"integration"|"support"|null,
  "shopifyPlan": "basic"|"advanced"|"plus"|"unknown"|null,
  "pm_whatSell": "physical"|"digital"|"services"|"mix"|null,
  "pm_skuCount": "small"|"med"|"large"|"xlarge"|null,
  "pm_goal": string|null,
  "pm_brandMaterials": "full"|"partial"|"none_theme"|"none_develop"|null,
  "pm_figmaReady": "full"|"partial"|"wireframes"|"no"|null,
  "sourcePlatform": "woo"|"magento"|"bigcommerce"|"wix"|"custom"|"other"|null,
  "pm_erp": string|null,
  "pm_accounting": string|null,
  "pm_dm": string|null,
  "pm_contact": string|null,
  "pm_hasDeadline": "yes"|"no"|null,
  "pm_deadlineDate": string|null,
  "pm_notes": string|null
}`}]
      })
    });
    const data=await resp.json();
    const raw=data.content?.[0]?.text||'';
    const parsed=JSON.parse(raw.replace(/```json|```/g,'').trim());
    Object.entries(parsed).forEach(([k,v])=>{ if(v!==null) A[k]=v; });
    status.textContent='✓ Заповнено';
    stepIdx=1; render();
  } catch(e){
    status.textContent='Помилка: '+e.message;
    btn.textContent='✦ Аналізувати →'; btn.style.opacity='1'; btn.style.pointerEvents='auto';
  }
}

function copyExport(){
  const text=document.getElementById('exportArea')?.textContent||'';
  navigator.clipboard.writeText(text).then(()=>{
    const btn=event.target;
    btn.textContent='✓ Скопійовано';
    setTimeout(()=>btn.textContent='📋 Копіювати для Jira',2000);
  });
}
